name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ansible-core==2.18.6 ansible-lint==25.6.1
      - run: ansible-galaxy collection install -r requirements.yml
      - run: cp inventories/dev/group_vars/all.yml.example inventories/dev/group_vars/all.yml
      - run: ansible-lint
        env:
          ANSIBLE_INVENTORY: /dev/null
      - run: ansible-playbook playbooks/00-provision.yml --syntax-check
        env:
          ANSIBLE_INVENTORY_UNPARSED_WARNING: "false"
