---
project_tag: devops-g12-p1
target_environment: dev
aws_region: us-east-1
aws_vpc_id: vpc-03e1838eb0ed22f86
aws_subnet_id: subnet-067191d8b8702dd03
aws_key_name: devops-g12-p1-dev
aws_ssh_private_key_file: /home/ubuntu/.ssh/devops-g12-p1-dev
ssh_allowed_cidr: 3.89.13.75/32
ansible_user: ubuntu
admin_user: devops
admin_public_key: "{{ lookup('ansible.builtin.file', '/home/ubuntu/.ssh/id_ed25519.pub') }}"
jenkins_agent_public_key: "{{ lookup('ansible.builtin.file', '/home/ubuntu/.ssh/jenkins-agent.pub') }}"
timezone: UTC
letsencrypt_email: ratana.chhan@skyvva.com
jenkins_domain: jenkins.trsd.tech
sonarqube_domain: sonarqube.trsd.tech
nexus_domain: nexus.trsd.tech
enable_portainer: true
portainer_bind_address: 127.0.0.1

jenkins_image: jenkins/jenkins:2.580.1-jdk21
sonarqube_image: sonarqube:26.10.0.133078-community
postgres_image: postgres:17.6-alpine
nexus_image: sonatype/nexus3:3.97.0
nginx_server_tokens: "off"

# Canonical Ubuntu Server 24.04 LTS owner. The playbook resolves the newest
# matching image at runtime; pin an explicit AMI ID before final submission.
aws_ami_owner: "099720109477"
aws_ami_name_pattern: ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*
aws_ami_id: ""

project_instances:
  - name: ci01
    group: jenkins
    eip_name: devops-g12-p1-dev-ci01-eip
    instance_type: m7i-flex.large
    root_volume_gb: 50
  - name: quality01
    group: sonarqube
    eip_name: devops-g12-p1-dev-quality01-eip
    instance_type: m7i-flex.large
    root_volume_gb: 60
  - name: artifacts01
    group: nexus
    eip_name: devops-g12-p1-dev-artifacts01-eip
    instance_type: m7i-flex.large
    root_volume_gb: 60
  - name: agent01
    group: build_agents
    eip_name: devops-g12-p1-dev-agent01-eip
    instance_type: c7i-flex.large
    root_volume_gb: 40
