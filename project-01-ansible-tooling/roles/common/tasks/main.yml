---
- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: This implementation supports Debian-family hosts.

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Update package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Create administrative user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    shell: /usr/bin/zsh
    groups: sudo
    append: true
    create_home: true

- name: Authorize administrative SSH key
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ admin_public_key }}"
    state: present

- name: Enable unattended security updates
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
