---
- name: Install firewall and intrusion prevention
  ansible.builtin.apt:
    name: [ufw, fail2ban]
    state: present

- name: Set default incoming firewall policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing firewall policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH from controller CIDR
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ ssh_allowed_cidr }}"

- name: Allow public HTTP and HTTPS on service hosts
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]
  when: service_group | default('') in ['jenkins', 'sonarqube', 'nexus']

- name: Enable firewall
  community.general.ufw:
    state: enabled

- name: Configure SSH hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/60-project-hardening.conf
    mode: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 4
  notify: Restart SSH

- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
