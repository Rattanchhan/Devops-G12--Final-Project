global:
  domain: argocd.trsd.tech
server:
  replicas: 2
  extraArgs: [--insecure]
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations: {cert-manager.io/cluster-issuer: letsencrypt-prod}
    tls: true
    hostname: argocd.trsd.tech
configs:
  params:
    server.insecure: true
  rbac:
    policy.default: role:readonly
controller:
  replicas: 1
repoServer:
  replicas: 2
applicationSet:
  replicas: 2

