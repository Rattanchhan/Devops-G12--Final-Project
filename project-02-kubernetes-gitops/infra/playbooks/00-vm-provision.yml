---
- name: Provision exactly four Project 02 nodes
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Prevent accidental duplicate infrastructure provisioning
      ansible.builtin.assert:
        that: provision_new_project2_instances | default(false) | bool
        fail_msg: >-
          Project 02 reuses the four Project 01 instances. Run
          00-reuse-project1-inventory.yml instead. Set
          provision_new_project2_instances=true only for an explicitly separate environment.
  vars_files:
    - ../../../project-01-ansible-tooling/inventories/dev/group_vars/all/main.yml
    - ../inventories/lab/group_vars/all/cloud.yml
  tasks:
    - name: Validate cloud inputs and topology
      ansible.builtin.assert:
        that:
          - project_tag == 'devops-g12-p2'
          - target_environment in ['lab', 'test']
          - cluster_nodes | length == 4
          - cluster_nodes | map(attribute='name') | list == ['master01', 'master02', 'worker01', 'worker02']
          - cluster_nodes | map(attribute='eip_name') | unique | length == 4
          - aws_vpc_id != 'CHANGE_ME'
          - aws_subnet_id != 'CHANGE_ME'
          - aws_key_name != 'CHANGE_ME'
          - "'/' not in aws_key_name"
          - aws_ssh_private_key_file != 'CHANGE_ME'
          - ssh_allowed_cidr != 'CHANGE_ME/32'
        fail_msg: Copy cloud.yml.example to cloud.yml and replace every CHANGE_ME value.

    - name: Import the controller public key as the EC2 key pair
      amazon.aws.ec2_key:
        name: "{{ aws_key_name }}"
        region: "{{ aws_region }}"
        key_material: "{{ lookup('ansible.builtin.file', aws_ssh_private_key_file + '.pub') }}"
        force: true
        tags:
          Project: "{{ project_tag }}"
          Environment: "{{ target_environment }}"
          ManagedBy: Ansible
        state: present

    - name: Read the shared Project 1 VPC
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        vpc_ids: ["{{ aws_vpc_id }}"]
      register: shared_vpc

    - name: Require exactly one shared VPC
      ansible.builtin.assert:
        that: shared_vpc.vpcs | length == 1
        fail_msg: The VPC referenced by Project 1 was not found.

    - name: Select the shared VPC primary CIDR
      ansible.builtin.set_fact:
        aws_vpc_cidr: "{{ shared_vpc.vpcs[0].cidr_block }}"

    - name: Resolve newest matching Ubuntu image when no AMI is pinned
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners: ["{{ aws_ami_owner }}"]
        filters:
          name: "{{ aws_ami_name_pattern }}"
          architecture: x86_64
          root-device-type: ebs
          state: available
      register: discovered_amis
      when: aws_ami_id | length == 0

    - name: Select machine image
      ansible.builtin.set_fact:
        selected_ami_id: >-
          {{ aws_ami_id if aws_ami_id | length > 0 else
             (discovered_amis.images | sort(attribute='creation_date') | last).image_id }}

    - name: Create cluster security group
      amazon.aws.ec2_security_group:
        name: "{{ cluster_security_group_name }}"
        description: Project 02 Kubernetes node traffic
        region: "{{ aws_region }}"
        vpc_id: "{{ aws_vpc_id }}"
        tags: {Project: "{{ project_tag }}", Environment: "{{ target_environment }}", ManagedBy: Ansible}
        rules:
          - {proto: tcp, ports: [22], cidr_ip: "{{ ssh_allowed_cidr }}", rule_desc: Controller SSH}
          - {proto: tcp, ports: [6443], cidr_ip: "{{ ssh_allowed_cidr }}", rule_desc: Restricted Kubernetes API}
          - {proto: tcp, ports: [80, 443], cidr_ip: 0.0.0.0/0, rule_desc: Public application ingress}
          - {proto: -1, cidr_ip: "{{ aws_vpc_cidr }}", rule_desc: Internal node communication}
        rules_egress:
          - {proto: -1, cidr_ip: 0.0.0.0/0}
      register: cluster_security_group

    - name: Create or reconcile exactly four cluster nodes
      amazon.aws.ec2_instance:
        name: "{{ item.name }}"
        region: "{{ aws_region }}"
        image_id: "{{ selected_ami_id }}"
        instance_type: "{{ item.instance_type }}"
        key_name: "{{ aws_key_name }}"
        network_interfaces:
          - assign_public_ip: false
            delete_on_termination: true
            device_index: 0
            groups: ["{{ cluster_security_group.group_id }}"]
            subnet_id: "{{ aws_subnet_id }}"
        volumes:
          - device_name: /dev/sda1
            ebs: {volume_size: "{{ item.root_volume_gb }}", volume_type: gp3, delete_on_termination: true}
        exact_count: 1
        filters:
          "tag:Name": "{{ item.name }}"
          "tag:Project": "{{ project_tag }}"
          "tag:Environment": "{{ target_environment }}"
          instance-state-name: [pending, running, stopping, stopped]
        tags:
          Name: "{{ item.name }}"
          Project: "{{ project_tag }}"
          Environment: "{{ target_environment }}"
          Role: kubernetes
          ManagedBy: Ansible
        state: started
        wait: true
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }}"
      register: provisioned_instances

    - name: Index provisioned instances by node name
      ansible.builtin.set_fact:
        project_instance_details: >-
          {{ project_instance_details | default({}) |
             combine({item.item.name: item.instances[0]}) }}
      loop: "{{ provisioned_instances.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Discover each preallocated Elastic IP by Name tag
      amazon.aws.ec2_eip_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Name": "{{ item.eip_name }}"
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.eip_name }}"
      register: discovered_eips

    - name: Require exactly one Elastic IP for each node
      ansible.builtin.assert:
        that: item.addresses | length == 1
        fail_msg: >-
          Expected exactly one preallocated Elastic IP named
          {{ item.item.eip_name }}, but found {{ item.addresses | length }}.
      loop: "{{ discovered_eips.results }}"
      loop_control:
        label: "{{ item.item.eip_name }}"

    - name: Index Elastic IPs by node name
      ansible.builtin.set_fact:
        project_eip_addresses: >-
          {{ project_eip_addresses | default({}) |
             combine({item.item.name: item.addresses[0]}) }}
      loop: "{{ discovered_eips.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Associate each stable Elastic IP with its node
      amazon.aws.ec2_eip:
        region: "{{ aws_region }}"
        device_id: "{{ project_instance_details[item.name].instance_id }}"
        public_ip: "{{ project_eip_addresses[item.name].public_ip }}"
        allow_reassociation: true
        state: present
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }} -> {{ project_eip_addresses[item.name].public_ip }}"

    - name: Wait for SSH on each node
      ansible.builtin.wait_for:
        host: "{{ project_eip_addresses[item.name].public_ip }}"
        port: 22
        timeout: 300
        delay: 5
      loop: "{{ cluster_nodes }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Generate the only Project 02 Kubespray inventory
      ansible.builtin.template:
        src: templates/kubespray-hosts.yml.j2
        dest: "{{ playbook_dir }}/../kubespray/inventory/project02/hosts.yml"
        mode: "0600"

    - name: Reload generated inventory
      ansible.builtin.meta: refresh_inventory
