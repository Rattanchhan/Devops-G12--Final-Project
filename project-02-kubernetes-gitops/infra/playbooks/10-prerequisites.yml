---
- name: Prepare clean Kubernetes nodes
  hosts: all
  become: true
  gather_facts: true
  vars:
    confirm_in_place_migration: false
  tasks:
    - name: Require explicit approval to repurpose Project 01 hosts
      ansible.builtin.assert:
        that:
          - confirm_in_place_migration | bool
        fail_msg: >-
          Set confirm_in_place_migration=true only when the Project 01 hosts
          may be stopped and repurposed as Kubernetes nodes.

    - name: Validate supported host family
      ansible.builtin.assert:
        that: ansible_facts.os_family == 'Debian'

    - name: Read installed services before migration
      ansible.builtin.service_facts:

    - name: Stop and disable Project 01 host services
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - nginx
        - docker
      when: item + '.service' in ansible_facts.services

    - name: Disable the Project 01 host firewall for Kubernetes networking
      community.general.ufw:
        state: disabled
      when: "'ufw.service' in ansible_facts.services"

    - name: Set unique hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
    - name: Install required packages
      ansible.builtin.apt:
        name: [python3, python3-pip, curl, chrony]
        state: present
        update_cache: true
    - name: Disable swap now
      ansible.builtin.command: swapoff -a
      changed_when: false
    - name: Disable swap persistently
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#]\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'
    - name: Enable time synchronization
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true
