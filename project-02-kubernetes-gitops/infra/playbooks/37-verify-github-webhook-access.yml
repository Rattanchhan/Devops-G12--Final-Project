---
- name: Verify GitHub webhook token access
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../platform-config.yml
  tasks:
    - name: Load encrypted GitHub credentials
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vault.yml"
      no_log: true

    - name: Validate local inputs
      ansible.builtin.assert:
        that:
          - gitops_repository_slug | default('') | length > 0
          - "'OWNER/' not in gitops_repository_slug"
          - vault_github_webhook_token | default('') | length > 0
          - "'CHANGE_ME' not in vault_github_webhook_token"

    - name: Authenticate the token
      ansible.builtin.uri:
        url: https://api.github.com/user
        method: GET
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ vault_github_webhook_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        return_content: true
      register: github_user
      changed_when: false
      failed_when: false
      no_log: true

    - name: Read the configured GitOps repository
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ gitops_repository_slug }}"
        method: GET
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ vault_github_webhook_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        return_content: true
      register: github_repository
      changed_when: false
      failed_when: false
      no_log: true

    - name: Test repository webhook access
      ansible.builtin.uri:
        url: >-
          https://api.github.com/repos/{{ gitops_repository_slug
          }}/hooks?per_page=1
        method: GET
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ vault_github_webhook_token }}"
          X-GitHub-Api-Version: "2022-11-28"
        return_content: true
      register: github_webhooks
      changed_when: false
      failed_when: false
      no_log: true

    - name: Report safe GitHub access results
      ansible.builtin.debug:
        msg:
          authenticated_user: >-
            {{ (github_user.json | default({})).login | default('unavailable') }}
          authentication_status: "{{ github_user.status | default('unknown') }}"
          repository: "{{ gitops_repository_slug }}"
          repository_status: "{{ github_repository.status | default('unknown') }}"
          repository_admin: >-
            {{ ((github_repository.json | default({})).permissions |
                default({})).admin | default(false) }}
          webhook_status: "{{ github_webhooks.status | default('unknown') }}"
          webhook_message: >-
            {{ (github_webhooks.json | default({})).message |
               default('Access granted') }}

    - name: Require repository webhook access
      ansible.builtin.assert:
        that:
          - github_user.status | default(-1) == 200
          - github_repository.status | default(-1) == 200
          - github_webhooks.status | default(-1) == 200
        fail_msg: >-
          Token verification failed. Status 401 means the token is invalid or
          expired; repository status 404 means the repository was not selected
          or the slug is wrong; webhook status 403 means Webhooks permission or
          organization approval is missing.
